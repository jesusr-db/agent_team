<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 756" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq-journey-fix-title seq-journey-fix-desc" id="seq-journey-fix-root">
<title id="seq-journey-fix-title">Fix and validate journeys before redeploy</title>
<desc id="seq-journey-fix-desc">When a deployed journey fails, the developer fixes it, then every journey is re-run against the app started locally, plus a UX regression check if the frontend changed. Only when everything passes locally is the app redeployed, followed by one confirming run, with up to three attempts.</desc>
<defs>
      <style>#seq-journey-fix-root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --accent:#bf4520; }
      #seq-journey-fix-root { font-family: 'Geist', system-ui, sans-serif; color: var(--ink); }
      #seq-journey-fix-root .scroll { overflow-x: auto; }
      #seq-journey-fix-root .notes { list-style: none; margin-top: 1.25rem; font-size: 0.78rem; color: var(--muted); line-height: 1.6; }
      #seq-journey-fix-root .notes b { font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 500; font-size: 0.7rem;
               letter-spacing: 0.08em; color: var(--ink); margin-right: 0.5rem; }</style>
<marker id="seq-journey-fix-seq-journey-fix-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="seq-journey-fix-seq-journey-fix-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="seq-journey-fix-seq-journey-fix-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
</defs>
