<title id="seq-improve-ux-title">/improve-ux on an existing app</title>
<desc id="seq-improve-ux-desc">You give a UX direction. The critic audits the app as it is today, you review the audit, the analyst redesigns the spec, the developer rebuilds the affected pages, and the critic gate loops fixes until it passes. Deploy and journey validation then follow as in the journey diagram.</desc>
