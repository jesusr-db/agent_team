      <style>#seq-improve-ux-root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --accent:#bf4520; }
      #seq-improve-ux-root { font-family: 'Geist', system-ui, sans-serif; color: var(--ink); }
      #seq-improve-ux-root .scroll { overflow-x: auto; }
      #seq-improve-ux-root .notes { list-style: none; margin-top: 1.25rem; font-size: 0.78rem; color: var(--muted); line-height: 1.6; }
      #seq-improve-ux-root .notes b { font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 500; font-size: 0.7rem;
               letter-spacing: 0.08em; color: var(--ink); margin-right: 0.5rem; }</style>
