<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 836" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq-red-team-title seq-red-team-desc" id="seq-red-team-root">
<title id="seq-red-team-title">Adversarial review in rounds of batched probes</title>
<desc id="seq-red-team-desc">The reviewer runs up to three rounds of batched probes, each round writing a batch, running it once and reading the results. Findings go to the orchestrator, which loops fixes and QA, then re-reviews by re-running only the probes behind earlier findings plus one regression round.</desc>
<defs>
      <style>#seq-red-team-root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --accent:#bf4520; }
      #seq-red-team-root { font-family: 'Geist', system-ui, sans-serif; color: var(--ink); }
      #seq-red-team-root .scroll { overflow-x: auto; }
      #seq-red-team-root .notes { list-style: none; margin-top: 1.25rem; font-size: 0.78rem; color: var(--muted); line-height: 1.6; }
      #seq-red-team-root .notes b { font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 500; font-size: 0.7rem;
               letter-spacing: 0.08em; color: var(--ink); margin-right: 0.5rem; }</style>
<marker id="seq-red-team-seq-red-team-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="seq-red-team-seq-red-team-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
