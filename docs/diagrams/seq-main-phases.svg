<title id="seq-main-phases-title">Phases, agents and gates</title>
<desc id="seq-main-phases-desc">The orchestrator runs Phase 0 discovery and SME, pauses for human confirmation, loops builders and QA in phases one to three until QA passes, then deploys and runs final journeys and the adversarial review in phase four.</desc>
<defs>
      <style>#seq-main-phases-root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --accent:#bf4520; }
      #seq-main-phases-root { font-family: 'Geist', system-ui, sans-serif; color: var(--ink); }
      #seq-main-phases-root .scroll { overflow-x: auto; }
      #seq-main-phases-root .notes { list-style: none; margin-top: 1.25rem; font-size: 0.78rem; color: var(--muted); line-height: 1.6; }
      #seq-main-phases-root .notes b { font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 500; font-size: 0.7rem;
               letter-spacing: 0.08em; color: var(--ink); margin-right: 0.5rem; }</style>
