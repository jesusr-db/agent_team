<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 756" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq-qa-loop-title seq-qa-loop-desc" id="seq-qa-loop-root">
<title id="seq-qa-loop-title">Phase execution and the QA fix loop</title>
<desc id="seq-qa-loop-desc">The orchestrator dispatches builders, then QA. On a QA failure it loops: dispatch fix agents scoped to the failures and re-run QA, up to three attempts, escalating to the human after the third failure. After QA passes the adversarial reviewer runs.</desc>
<defs>
      <style>#seq-qa-loop-root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --accent:#bf4520; }
      #seq-qa-loop-root { font-family: 'Geist', system-ui, sans-serif; color: var(--ink); }
      #seq-qa-loop-root .scroll { overflow-x: auto; }
      #seq-qa-loop-root .notes { list-style: none; margin-top: 1.25rem; font-size: 0.78rem; color: var(--muted); line-height: 1.6; }
      #seq-qa-loop-root .notes b { font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 500; font-size: 0.7rem;
               letter-spacing: 0.08em; color: var(--ink); margin-right: 0.5rem; }</style>
<marker id="seq-qa-loop-seq-qa-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="seq-qa-loop-seq-qa-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
